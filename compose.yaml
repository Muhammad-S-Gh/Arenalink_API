services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        container_name: arenalink-api
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - '3000:3000'
        volumes:
            - .:/app
            - /app/node_modules
            - uploads:/app/uploads
        depends_on:
            db:
                condition: service_healthy
        command: npm run start:dev

    db:
        image: postgres:17-alpine
        container_name: arenalink-db
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    uploads:
